# Local PostgreSQL for development: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hrpay
      POSTGRES_PASSWORD: hrpay
      POSTGRES_DB: hrpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
