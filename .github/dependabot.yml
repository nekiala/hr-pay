# Weekly pull requests for outdated or vulnerable dependencies. Security updates are opened as soon as an
# advisory is published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/, /deploy/backup]
    schedule:
      interval: weekly
    # A new Java version is a change to build.gradle.kts (toolchain) as well: done by hand, never by a bot.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
