name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrpay
          POSTGRES_PASSWORD: hrpay
          POSTGRES_DB: hrpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrpay" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/hrpay_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hr-pay:ci .
      - run: docker build -t hr-pay-backup:ci deploy/backup
      - run: DB_PASSWORD=ci docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
