spring:
  # Tests keep sessions in MockMvc's memory; SessionStoreIT checks the PostgreSQL store on a real server.
  autoconfigure:
    exclude: org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/hrpay_test}
  flyway:
    clean-disabled: false
app:
  # A test-only key.
  data-key: NlryzUGH4GFRF6LVmdQUOx63PIJOAGKVQPEBQD2koF4=
  tenancy:
    # The tests' own database calls (outside a request) reach the demo company.
    default-company: 1
  sample-data:
    enabled: true
    password: Demo@2026!
    attendance: false
  exchange-rates:
    fetch-enabled: false
  security:
    # TwoStepIT turns the roles' requirement on for its own tests.
    two-step-enforced: false
  webhooks:
    # Deliveries are sent by the tests themselves, never in the background.
    every: PT10H
