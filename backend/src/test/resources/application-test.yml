spring:
  # Tests keep sessions in MockMvc's memory; SessionStoreIT checks the PostgreSQL store on a real server.
  autoconfigure:
    exclude: org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/hrpay_test}
  flyway:
    clean-disabled: false
app:
  # A test-only key.
  data-key: NlryzUGH4GFRF6LVmdQUOx63PIJOAGKVQPEBQD2koF4=
  tenancy:
    # The tests' own database calls (outside a request) reach the demo company.
    default-company: 1
  sample-data:
    enabled: true
    password: Demo@2026!
    attendance: false
  exchange-rates:
    fetch-enabled: false
  security:
    # TwoStepIT turns the roles' requirement on for its own tests.
    two-step-enforced: false
  webhooks:
    # Deliveries are sent by the tests themselves, never in the background.
    every: PT10H
  jobs:
    # Requests wait for their job, as they did before jobs ran in the background (JobsIT checks the 202 answer).
    inline-wait: PT2M
    # Workers only take the jobs their own test context starts (each context has its own workers).
    poll: PT1H
    heartbeat: PT1S
  payroll:
    # PayrollChecksIT turns the checks before approval on; other tests approve sample months freely.
    checks-required: false
    # Every test payroll goes through the threads, as a large one does.
    parallel-from: 1
  whatsapp:
    # WhatsAppIT answers as Meta on this port; nothing sends in the background.
    api-url: http://127.0.0.1:18099/v21.0
    every: PT10H
  announcements:
    every: PT10H
