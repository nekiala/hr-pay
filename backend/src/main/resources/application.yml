spring:
  application:
    name: hr-pay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrpay}
    username: ${DB_USER:hrpay}
    password: ${DB_PASSWORD:hrpay}
    hikari:
      # Database connections per app server; PostgreSQL allows 100 by default.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Migrations use a connection of their own, as the database owner, that sees every company. The app's own
    # connections run as the hrpay_app role and see one company at a time (row-level security).
    user: ${DB_USER:hrpay}
    password: ${DB_PASSWORD:hrpay}
    init-sqls: set app.bypass = 'on'
  # Sessions live in PostgreSQL (tables made by Flyway), shared by every API server and kept across restarts.
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */5 * * * *"

server:
  port: ${SERVER_PORT:8081}
  # Set to "native" behind a reverse proxy so the client IP (used for site checks) comes from X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Liveness and readiness at /actuator/health/liveness and /readiness, for Docker and load balancers.
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true
    java:
      enabled: true

logging:
  structured:
    format:
      # "ecs" writes one JSON line per log entry, for log collectors; empty keeps the readable format.
      console: ${LOG_FORMAT:}

app:
  # Key that encrypts bank accounts, CNSS and tax numbers and authenticator secrets: base64 of 32 random bytes
  # (openssl rand -base64 32). Keep a copy outside the server: backups cannot be read without it.
  data-key: ${HRPAY_DATA_KEY:}
  data-key-file: ${HRPAY_DATA_KEY_FILE:}
  # Sign in with Google / Microsoft 365: set a client id to turn each on. Microsoft also needs each company's
  # tenant (directory) id on its Company page.
  oidc:
    google:
      client-id: ${GOOGLE_CLIENT_ID:${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}}
      client-secret: ${GOOGLE_CLIENT_SECRET:${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}}
    microsoft:
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
  security:
    # Members of roles marked "two-step required" (administrators, HR, finance) must use a second step.
    two-step-enforced: ${TWO_STEP_ENFORCED:true}
  # SaaS (many companies, plans set by the provider) or on-premise (a signed licence file sets the limits).
  licensing:
    mode: ${LICENSING_MODE:saas}
  tenancy:
    # The provider's own company: its administrators get the system alerts and manage the other companies.
    provider-company: ${PROVIDER_COMPANY:1}
  # Creates the first administrator when the user table is empty.
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # Loads a demo site and sample users. Never enable in production.
  sample-data:
    enabled: ${SAMPLE_DATA:false}
    password: ${SAMPLE_PASSWORD:Demo@2026!}
  # A public demo: the database is WIPED at every start and the app restarts every night at 3:00 (Kinshasa) to start
  # fresh with the sample data. Only for a server of its own; it refuses to start without SAMPLE_DATA=true.
  demo:
    enabled: ${DEMO_MODE:false}
  # "all" (default) answers the web and runs background jobs; "web" only answers; "worker" is meant to only run jobs
  # (a second container from the same image, for a large installation). Jobs wait in PostgreSQL, nothing else to run.
  role: ${APP_ROLE:all}
  jobs:
    # Threads running background jobs on this server (payroll calculation, closing, imports, zips).
    workers: ${JOBS_WORKERS:2}
    # How long a page waits for its job before showing a progress bar instead (small jobs answer at once).
    inline-wait: ${JOBS_INLINE_WAIT:PT3S}
    # How often idle workers look for jobs started on another server.
    poll: ${JOBS_POLL:PT2S}
    heartbeat: PT15S
    # A running job whose server sent no heartbeat for this long is put back in the queue (at most 3 tries).
    stale-after: PT2M
    # Jobs that end later than this are also announced by email; administrators are alerted past alert-wait.
    email-after: PT2M
    alert-wait: PT10M
    # On shutdown, how long running jobs get to finish before they are left to another server.
    shutdown-wait: ${JOBS_SHUTDOWN_WAIT:PT60S}
  # Frontend origin allowed to call the API in development.
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # Address employees reach the app at; used in the kiosk QR code.
  public-url: ${PUBLIC_URL:http://localhost:5173}
  notifications:
    mail-from: ${MAIL_FROM:HR Pay <no-reply@hrpay.local>}
    # WhatsApp Cloud API (Meta). Leave empty to send codes by email only.
    whatsapp-token: ${WHATSAPP_TOKEN:}
    whatsapp-phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    whatsapp-template: ${WHATSAPP_TEMPLATE:hrpay_otp}
    whatsapp-language: ${WHATSAPP_LANGUAGE:fr}
  # The production set-up runs a backup job; when true, an alert goes out if no backup succeeded for 26 hours.
  backups:
    expected: ${BACKUPS_EXPECTED:false}
  # BCC exchange rates (CDF per unit). Fetched at start-up and twice a day; HR can enter one by hand.
  exchange-rates:
    url: ${EXCHANGE_RATES_URL:https://exchange-api.ntoprog.org/api/v1/exchange-rates/current}
    fetch-enabled: ${EXCHANGE_RATES_FETCH:true}
