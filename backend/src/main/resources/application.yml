spring:
  application:
    name: hr-pay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrpay}
    username: ${DB_USER:hrpay}
    password: ${DB_PASSWORD:hrpay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}
  # Set to "native" behind a reverse proxy so the client IP (used for site checks) comes from X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Creates the first administrator when the user table is empty.
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  # Loads a demo site and sample users. Never enable in production.
  sample-data:
    enabled: ${SAMPLE_DATA:false}
    password: ${SAMPLE_PASSWORD:Demo@2026!}
  # Frontend origin allowed to call the API in development.
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # Address employees reach the app at; used in the kiosk QR code.
  public-url: ${PUBLIC_URL:http://localhost:5173}
  notifications:
    mail-from: ${MAIL_FROM:HR Pay <no-reply@hrpay.local>}
    # WhatsApp Cloud API (Meta). Leave empty to send codes by email only.
    whatsapp-token: ${WHATSAPP_TOKEN:}
    whatsapp-phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    whatsapp-template: ${WHATSAPP_TEMPLATE:hrpay_otp}
    whatsapp-language: ${WHATSAPP_LANGUAGE:fr}
